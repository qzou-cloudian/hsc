[package]
name = "hsc"
version = "0.3.3"
edition = "2021"
authors = ["Qingshan <qzou@cloudian.com>"]
description = "High-performance S3 CLI tool"
license = "MIT"
repository = "https://github.com/qzou-cloudian/hsc"
keywords = ["s3", "aws", "cli", "cloud-storage"]
categories = ["command-line-utilities"]

[features]
# Enable RDMA support with the plugin client (loads libs3rdmaclient.so at
# runtime) and mock provider.  The cuobj client is always included so that
# `--rdma plugin` / `--rdma auto` work out of the box.
rdma = ["dep:s3-rdma", "s3-rdma/rdma-client"]
# Alias for `rdma`; kept for backward compatibility with existing build scripts.
cuobj = ["rdma"]

[dependencies]
aws-config = "1.8.14"
aws-credential-types = "1"
aws-sdk-s3 = "1.124.0"
aws-smithy-runtime = { version = "1", features = ["client", "connector-hyper-0-14-x"] }
aws-smithy-runtime-api = "1.11"
aws-smithy-types = "1.2"
base64 = "0.22"
chrono = "0.4.44"
clap = { version = "4.5.60", features = ["derive"] }
crc32fast = "1.5.0"
crc32c = "0.6.8"
futures-util = "0.3.32"
glob = "0.3.3"
hyper = { version = "0.14", features = ["full"] }
hyper-rustls = { version = "0.24", features = ["rustls-native-certs", "http2"] }
rustls = { version = "0.21", features = ["dangerous_configuration"] }
s3-rdma = { path = "../s3-rdma/core", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md-5 = "0.10.6"
sha-1 = "0.10.1"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["full"] }
tower-service = "0.3"
walkdir = "2.5.0"
