[workspace]
members = [".", "crates/hsc-rdma"]

[package]
name = "hsc"
version = "0.2.0"
edition = "2021"
authors = ["Qingshan <qzou@cloudian.com>"]
description = "High-performance S3 CLI tool"
license = "MIT"
repository = "https://github.com/qzou-cloudian/hsc"
keywords = ["s3", "aws", "cli", "cloud-storage"]
categories = ["command-line-utilities"]

[features]
# Enable RDMA support (interceptor + mock provider)
rdma = ["dep:hsc-rdma"]
# Enable real NVIDIA cuObject RDMA provider (requires cuObject SDK)
cuobject = ["rdma", "hsc-rdma/cuobject"]

[dependencies]
aws-config = "1.8.14"
aws-sdk-s3 = "1.124.0"
aws-smithy-runtime-api = "1.11"
aws-smithy-types = "1.2"
chrono = "0.4.44"
clap = { version = "4.5.60", features = ["derive"] }
crc32fast = "1.5.0"
futures-util = "0.3.32"
glob = "0.3.3"
hsc-rdma = { path = "crates/hsc-rdma", optional = true }
md-5 = "0.10.6"
sha-1 = "0.10.1"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5.0"
