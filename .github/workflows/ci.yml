name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

# s3-rdma and cuobj are public path dependencies expected next to this repo
# (../s3-rdma, ../cuobj).  Every job that runs cargo clones them first.
# hsc builds with the rdma feature by default; the cuobj-enabled
# libs3rdmaclient.so plugin is built in the Docker builder images, which carry
# the latest NVIDIA cuObject client SDK.

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Clone path dependencies
        run: |
          git clone --depth 1 https://github.com/qzou-cloudian/s3-rdma.git ../s3-rdma
          git clone --depth 1 https://github.com/qzou-cloudian/cuobj.git ../cuobj
      - name: Run tests
        run: cargo test --verbose

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Clone path dependencies
        run: |
          git clone --depth 1 https://github.com/qzou-cloudian/s3-rdma.git ../s3-rdma
          git clone --depth 1 https://github.com/qzou-cloudian/cuobj.git ../cuobj
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # hsc + cuobj plugin for Ubuntu 24.04 and Rocky 8, built in the same Docker
  # images used for releases.
  build-linux:
    name: Build Linux (hsc + cuobj plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone path dependencies
        run: |
          git clone --depth 1 https://github.com/qzou-cloudian/s3-rdma.git ../s3-rdma
          git clone --depth 1 https://github.com/qzou-cloudian/cuobj.git ../cuobj
      - name: Build builder images
        run: make docker-images
      - name: Build
        run: |
          mkdir -p ~/.cargo/registry ~/.cargo/git
          make all
          ls -l dist/*/

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Clone path dependencies
        run: |
          git clone --depth 1 https://github.com/qzou-cloudian/s3-rdma.git ../s3-rdma
          git clone --depth 1 https://github.com/qzou-cloudian/cuobj.git ../cuobj
      - name: Build
        run: cargo build --release --verbose
