name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

# Reusable step to create stub crates for private path dependencies.
# s3-rdma and its cuobj dep live in private repos not available in CI.
# Cargo resolves ALL path deps (even optional ones) at startup, so stubs
# are required even when the rdma/cuobj features are not enabled.

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Create stubs for private path dependencies
        run: |
          mkdir -p ../s3-rdma/core/src
          printf '[package]\nname = "s3-rdma"\nversion = "0.1.0"\nedition = "2021"\n\n[features]\ncuobj = []\n' \
              > ../s3-rdma/core/Cargo.toml
          touch ../s3-rdma/core/src/lib.rs
      - name: Run tests
        run: cargo test --verbose
      
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Create stubs for private path dependencies
        run: |
          mkdir -p ../s3-rdma/core/src
          printf '[package]\nname = "s3-rdma"\nversion = "0.1.0"\nedition = "2021"\n\n[features]\ncuobj = []\n' \
              > ../s3-rdma/core/Cargo.toml
          touch ../s3-rdma/core/src/lib.rs
      - name: Run clippy
        run: cargo clippy -- -D warnings
  
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
  
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Create stubs for private path dependencies
        run: |
          mkdir -p ../s3-rdma/core/src
          printf '[package]\nname = "s3-rdma"\nversion = "0.1.0"\nedition = "2021"\n\n[features]\ncuobj = []\n' \
              > ../s3-rdma/core/Cargo.toml
          touch ../s3-rdma/core/src/lib.rs
      - name: Build
        run: cargo build --release --verbose
