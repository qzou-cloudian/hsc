name: Release

# Triggered by version tags (e.g. v0.3.2).
# Builds hsc (rdma feature) for Linux and macOS, the cuobj-enabled
# libs3rdmaclient.so plugin for Linux, RPM and DEB packages, then publishes a GitHub Release with all artifacts attached.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux: hsc + cuobj plugin, RPM and DEB ────────────────────────────────
  # Built in the Docker builder images (latest NVIDIA cuObject client SDK).
  # The Rocky 8 build (glibc 2.28) is also published as the standalone Linux
  # binary so it runs on both older and newer distributions.  A static musl
  # binary is not used because it cannot dlopen libs3rdmaclient.so.
  linux:
    name: Build Linux binaries and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone path dependencies
        run: |
          git clone --depth 1 https://github.com/qzou-cloudian/s3-rdma.git ../s3-rdma
          git clone --depth 1 https://github.com/qzou-cloudian/cuobj.git ../cuobj

      - name: Check tag matches Cargo.toml version
        run: |
          v=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"//;s/"//')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $v"; exit 1; }

      - name: Build builder images
        run: make docker-images

      - name: Build binaries and packages
        run: |
          mkdir -p ~/.cargo/registry ~/.cargo/git
          make packages

      - name: Stage artifacts
        run: |
          mkdir -p out
          cp dist/rocky-8/hsc                out/hsc-linux-x86_64
          cp dist/rocky-8/libs3rdmaclient.so out/libs3rdmaclient-linux-x86_64.so
          cp dist/rocky-8/*.rpm dist/ubuntu-24.04/*.deb out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  # ── macOS binaries (rdma feature; no cuObject SDK on macOS) ───────────────
  macos:
    name: Build ${{ matrix.artifact }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (arm64) — native build.
          - target: aarch64-apple-darwin
            artifact: hsc-darwin-aarch64
          # macOS Intel (x86_64) — cross-compiled on the Apple Silicon runner
          # (macos-13 Intel runners are retired).
          - target: x86_64-apple-darwin
            artifact: hsc-darwin-x86_64

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Clone path dependencies
        run: |
          git clone --depth 1 https://github.com/qzou-cloudian/s3-rdma.git ../s3-rdma
          git clone --depth 1 https://github.com/qzou-cloudian/cuobj.git ../cuobj

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        run: cp target/${{ matrix.target }}/release/hsc ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ── Create GitHub Release ──────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/linux/*
            artifacts/hsc-darwin-aarch64/hsc-darwin-aarch64
            artifacts/hsc-darwin-x86_64/hsc-darwin-x86_64
